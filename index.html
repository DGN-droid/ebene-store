<!doctype html>
<html lang="fr" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ébène — Mode contemporaine</title>
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/components.css">
  <link rel="stylesheet" href="styles/site-overrides.css">
  <style>
    main { min-height: 0; }
    .hero--product-coverflow { min-height: calc(100vh - 5.25rem); padding: 4rem 1rem; background: transparent; }
    .hero-video { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; object-fit: cover; z-index: 0; margin: 0; padding: 0; }
    .hero-product-scrim { position: absolute; inset: 0; z-index: 1; background: rgb(20 12 8 / 48%); }
    .hero-product-coverflow { position: relative; z-index: 1; display: grid; justify-items: center; width: min(1040px, 100%); margin: auto; }
    #header-slot { position: relative; z-index: 20; }
    main { position: relative; z-index: 1; }
    .hero-product-track { position: relative; width: min(940px, 100%); height: 400px; }
    .hero-product-card { position: absolute; top: 0; left: 50%; width: min(260px, 29vw); overflow: hidden; border-radius: var(--radius); background: var(--surface); color: var(--text); box-shadow: 0 22px 45px rgb(0 0 0 / 28%); opacity: 0; visibility: hidden; transform: translateX(-50%) scale(.72); filter: blur(6px); transition: transform .9s ease-in-out, filter .9s ease-in-out, opacity .9s ease-in-out, visibility 0s linear .9s; }
    .hero-product-card.is-active, .hero-product-card.is-previous, .hero-product-card.is-next { visibility: visible; transition-delay: 0s; }
    .hero-product-card.is-active { z-index: 3; opacity: 1; filter: blur(0); transform: translateX(-50%) scale(1); }
    .hero-product-card.is-previous, .hero-product-card.is-next { z-index: 1; opacity: .6; filter: blur(5px); }
    .hero-product-card.is-previous { transform: translateX(calc(-50% - 270px)) scale(.85); }
    .hero-product-card.is-next { transform: translateX(calc(-50% + 270px)) scale(.85); }
    .hero-product-card__image { position: relative; height: 270px; overflow: hidden; border-radius: var(--radius) var(--radius) 0 0; background: linear-gradient(145deg, #a0846b, #3b2a1e); }
    .hero-product-card__image::after { content: "ÉBÈNE"; position: absolute; inset: 0; display: grid; place-items: center; color: rgb(255 255 255 / 72%); font-family: var(--font-display); font-size: 1rem; }
    .hero-product-card__image img { position: relative; z-index: 1; width: 100%; height: 100%; object-fit: cover; }
    .hero-product-card__image img.is-missing { display: none; }
    .hero-product-card__body { min-height: 124px; padding: 1rem 1.1rem 1.15rem; }
    .hero-product-card__category { margin: 0 0 .45rem; color: var(--muted); font-size: .67rem; font-weight: 700; letter-spacing: .13em; text-transform: uppercase; }
    .hero-product-card h2 { margin: 0; font-size: 1.35rem; }
    .hero-product-card__meta { margin: .5rem 0 0; font-size: .82rem; }
    .hero-collection-action { padding-top: 40px; text-align: center; }
    .hero-collection-action .button--accent { background: #a67c52; border-color: #a67c52; color: #1a1410; border-radius: 999px; padding-inline: 1.5rem; }

    @media (max-width: 767px) {
      .hero--product-coverflow { min-height: calc(100vh - 5.25rem); padding: 5rem 0 3rem; }
      .hero-product-coverflow, .hero-product-track { width: 100%; }
      .hero-product-track { height: 340px; }
      .hero-product-card { width: min(220px, 68vw); }
      .hero-product-card.is-previous { transform: translateX(calc(-50% - 190px)) scale(.8); }
      .hero-product-card.is-next { transform: translateX(calc(-50% + 190px)) scale(.8); }
      .hero-product-card__image { height: min(92vw, 380px); }
    }

    @media (prefers-reduced-motion: reduce) {
      .hero-product-card { transition-duration: .01ms; }
    }
  </style>
  <script type="module" src="src/main.js"></script>
</head>
<body class="is-loading page-home" data-page="home">
  <div id="header-slot"></div>
  <main>
    <section class="hero hero--product-coverflow">
      <video autoplay muted playsinline preload="auto" class="hero-video" data-lazy-video>
        <source type="video/mp4">
      </video>
      <div class="hero-product-scrim" aria-hidden="true"></div>
      <div class="hero-product-coverflow" data-hero-product-coverflow>
        <div class="hero-product-track" data-hero-product-track aria-label="Produits à découvrir"></div>
        <div class="hero-collection-action">
          <a class="button button--accent" data-i18n="seeMore" href="boutique.html">Voir plus</a>
        </div>
      </div>
    </section>
  </main>
  <script type="module">
    const coverflow = document.querySelector('[data-hero-product-coverflow]');
    const track = coverflow?.querySelector('[data-hero-product-track]');
    const heroVideo = document.querySelector('.hero-video');
    const heroVideoSource = heroVideo?.querySelector('source');
    const playlist = [
      'assets/videos/celineboutique3D.mp4',
      'assets/videos/parfum3D.mp4',
      'assets/videos/parfum2D.mp4',
      'assets/videos/Robe.mp4',
      'assets/videos/robe3D.mp4'
    ];
    const mobileQuery = window.matchMedia('(max-width: 767px)');
    const formatPrice = new Intl.NumberFormat('fr-FR', { style: 'currency', currency: 'EUR' });
    let cards = [];
    let activeIndex = 0;
    let autoplayTimer;

    function buildProductCard(product) {
      const card = document.createElement('article');
      card.className = 'hero-product-card';
      const imageWrap = document.createElement('div');
      imageWrap.className = 'hero-product-card__image';
      const image = document.createElement('img');
      image.src = product.image;
      image.alt = product.name;
      image.loading = 'lazy';
      image.decoding = 'async';
      image.width = 480;
      image.height = 600;
      image.addEventListener('error', () => image.classList.add('is-missing'));
      imageWrap.append(image);
      const body = document.createElement('div');
      body.className = 'hero-product-card__body';
      const category = document.createElement('p');
      category.className = 'hero-product-card__category';
      category.textContent = product.category;
      const title = document.createElement('h2');
      title.textContent = product.name;
      const meta = document.createElement('p');
      meta.className = 'hero-product-card__meta';
      meta.append(`${product.category} · `);
      const price = document.createElement('strong');
      price.textContent = formatPrice.format(product.price);
      meta.append(price);
      body.append(category, title, meta);
      card.append(imageWrap, body);
      return card;
    }

    function updateCoverflow() {
      const previousIndex = (activeIndex - 1 + cards.length) % cards.length;
      const nextIndex = (activeIndex + 1) % cards.length;
      cards.forEach((card, index) => {
        card.className = 'hero-product-card';
        if (index === activeIndex) card.classList.add('is-active');
        if (index === previousIndex) card.classList.add('is-previous');
        if (index === nextIndex) card.classList.add('is-next');
        card.setAttribute('aria-hidden', index === activeIndex ? 'false' : 'true');
      });
    }

    function stopAutoplay() { window.clearTimeout(autoplayTimer); }

    function scheduleAutoplay(delay = 4800) {
      stopAutoplay();
      if (cards.length < 2) return;
      autoplayTimer = window.setTimeout(() => {
        activeIndex = (activeIndex + 1) % cards.length;
        updateCoverflow();
        scheduleAutoplay();
      }, delay);
    }

    async function initCoverflow() {
      if (!coverflow || !track) return;
      const response = await fetch(new URL('./src/data/products.json', import.meta.url));
      if (!response.ok) throw new Error(`Chargement des produits impossible (${response.status})`);
      const products = await response.json();
      const featured = products.filter((product) => product.featured);
      const selected = (featured.length ? featured : products).slice(0, 5);
      selected.forEach((product) => track.append(buildProductCard(product)));
      cards = [...track.children];
      if (!cards.length) return;
      const handleMediaChange = () => { updateCoverflow(); scheduleAutoplay(2500); };
      mobileQuery.addEventListener('change', handleMediaChange);
      updateCoverflow();
      scheduleAutoplay();
    }

    let heroVideoIndex = 0;
    const nextVideoPreloader = document.createElement('video');
    nextVideoPreloader.muted = true;
    nextVideoPreloader.preload = 'auto';

    function preloadNextHeroVideo() {
      const nextIndex = (heroVideoIndex + 1) % playlist.length;
      nextVideoPreloader.src = playlist[nextIndex];
      nextVideoPreloader.load();
    }

    function playHeroVideo(index) {
      if (!heroVideo || !heroVideoSource || !playlist.length) return;
      try {
        heroVideoIndex = index % playlist.length;
        heroVideoSource.src = playlist[heroVideoIndex];
        heroVideo.load();
        preloadNextHeroVideo();
        heroVideo.play().catch((error) => console.warn('Hero video playback delayed', error));
      } catch (error) {
        console.error('Hero video load failed', playlist[heroVideoIndex], error);
        window.setTimeout(() => playHeroVideo((heroVideoIndex + 1) % playlist.length), 250);
      }
    }

    function advanceHeroVideo() {
      playHeroVideo((heroVideoIndex + 1) % playlist.length);
    }

    function initHeroVideoPlaylist() {
      if (!heroVideo || !heroVideoSource || !playlist.length) return;
      heroVideo.addEventListener('ended', advanceHeroVideo);
      heroVideo.addEventListener('error', () => {
        console.error('Hero video source failed', playlist[heroVideoIndex]);
        advanceHeroVideo();
      });
      playHeroVideo(0);
    }

    try {
      initHeroVideoPlaylist();
      initCoverflow().catch((error) => console.error('Coverflow initialization failed', error));
    } catch (error) {
      console.error('Hero initialization failed', error);
    }
  </script>
</body>
</html>
